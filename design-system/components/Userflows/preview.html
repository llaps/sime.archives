<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Userflows</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--paper); }
  .uf { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  .uf-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: 20px 24px 12px; border-bottom: 1px solid var(--photocopy); }
  .uf-head h1 { margin: 4px 0 0; font-family: var(--font-display, var(--font-sans)); font-stretch: 112%; font-weight: 500; font-size: 32px; line-height: 1; }
  .uf-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .uf-legend span { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .uf-legend i { display: inline-block; width: 18px; height: 12px; border: 1.5px solid var(--ink); }
  .uf-legend .l-start { border-radius: 999px; }
  .uf-legend .l-action { border-style: dashed; border-color: var(--rule-strong); }
  .uf-legend .l-dec { width: 12px; height: 12px; transform: rotate(45deg); background: var(--accent); }
  .uf-legend .l-end { border-radius: 999px; background: var(--ink); }
  .uf-tabs { display: flex; gap: 2px; padding: 0 24px; border-bottom: 1px solid var(--photocopy); overflow-x: auto; }
  .uf-tabs button { padding: 12px 14px 10px; border-bottom: 2px solid transparent; color: var(--ink-muted); white-space: nowrap; display: inline-flex; gap: 8px; align-items: baseline; }
  .uf-tabs button b { font-family: var(--font-mono); font-weight: 400; font-size: 10px; }
  .uf-tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  .uf-tabs button.is-edited::after { content: "•"; color: var(--kraft-deep); }
  .uf-body { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .uf-canvas-wrap { position: relative; overflow: auto; background-image: radial-gradient(var(--photocopy) 1px, transparent 1px); background-size: 20px 20px; }
  .uf-tools { position: sticky; top: 12px; left: 12px; z-index: 3; display: inline-flex; gap: 4px; padding: 4px; margin: 12px; background: var(--paper); border: 1px solid var(--rule-strong); }
  .uf-tools button { padding: 6px 10px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .uf-tools button:hover, .uf-tools button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .uf-tools .sep { width: 1px; background: var(--photocopy); margin: 2px 4px; }
  svg.uf-svg { display: block; position: absolute; top: 0; left: 0; }
  .uf-node { cursor: grab; }
  .uf-node:active { cursor: grabbing; }
  .uf-node .shape { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .uf-node.t-action .shape { stroke: var(--rule-strong); stroke-dasharray: 5 4; }
  .uf-node.t-decision .shape { fill: var(--accent); }
  .uf-node.t-end .shape { fill: var(--ink); }
  .uf-node.is-sel .shape { stroke: var(--focus); stroke-width: 3; stroke-dasharray: none; }
  .uf-node.is-src .shape { stroke: var(--focus); stroke-width: 3; }
  .uf-label { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 6px 10px; box-sizing: border-box; font-family: var(--font-sans); font-size: 12.5px; line-height: 16px; color: var(--ink); pointer-events: none; }
  .uf-label small { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; color: var(--ink-muted); margin-bottom: 2px; }
  .t-end .uf-label, .t-end .uf-label small { color: var(--paper); }
  .t-start .uf-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .uf-edge path { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .uf-edge .hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
  .uf-edge.is-sel path.line { stroke: var(--focus); stroke-width: 2.5; }
  .uf-edge text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
  .uf-side { border-left: 1px solid var(--photocopy); padding: 18px; overflow-y: auto; display: grid; align-content: start; gap: 14px; background: var(--paper); }
  .uf-side h2 { margin: 0; font-family: var(--font-display, var(--font-sans)); font-stretch: 112%; font-weight: 500; font-size: 22px; line-height: 1.15; }
  .uf-side p { margin: 0; font-size: 13px; line-height: 20px; }
  .uf-side label { display: grid; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .uf-side input, .uf-side textarea, .uf-side select { font: 14px/20px var(--font-sans); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--paper); border: 1px solid var(--rule-strong); padding: 8px; border-radius: 0; }
  .uf-side textarea { min-height: 70px; resize: vertical; }
  .uf-side .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .uf-side .btn { padding: 8px 12px; border: 1px solid var(--ink); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .uf-side .btn--ink { background: var(--ink); color: var(--on-ink); }
  .uf-side .hint { font-family: var(--font-mono); font-size: 11px; line-height: 16px; color: var(--ink-muted); }
  .uf-side hr { border: 0; border-top: 1px solid var(--photocopy); margin: 4px 0; width: 100%; }
  .uf-io textarea { min-height: 160px; font-family: var(--font-mono); font-size: 11px; line-height: 15px; }
  .uf-mock { position: relative; overflow: hidden; background: var(--paper); border: 1px solid var(--rule-strong); }
  .uf-mock__in { transform-origin: 0 0; pointer-events: none; background: var(--paper); }
  .uf-mock__in .sa-header { position: relative; }
  .uf-tip { position: absolute; z-index: 5; background: var(--paper); border: 1px solid var(--ink); padding: 10px; box-shadow: var(--shadow-drawer); display: grid; gap: 8px; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .uf-tip.is-on { opacity: 1; }
  .uf-tip__cap { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .uf-tip__cap b { color: var(--ink); font-weight: 500; }
  .uf-node .has-mock { fill: var(--ink); }
</style>
</head>
<body class="sa">
<div class="uf">

<script>

  }
  var DEFAULTS = [
    flow("drop", "Achat pendant une récolte", "D'Instagram à la confirmation de commande, le parcours principal du Shop.", [

  function mockKey(n) {

    else if (k === "home") h = S.announcementBar() + S.header() + S.dropCountdown();

  side.addEventListener("change", function (e) { if (e.target.dataset.f === "t" || e.target.dataset.f === "mock") { var f = getFlow(cur), n = f.nodes.filter(function (x) { return sel && x.id === sel.id; })[0]; if (n) { n[e.target.dataset.f] = e.target.value; save(); renderTabs(); } render(); } });
  side.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var f = getFlow(cur), a = b.dataset.act, io;
    if (a === "delnode" || a === "deledge") removeSel();
    if (a === "dup" && sel) { var n = f.nodes.filter(function (x) { return x.id === sel.id; })[0], c = clone(n); c.id = "n" + Date.now().toString(36); c.x += 30; c.y += 30; f.nodes.push(c); sel = { kind: "node", id: c.id }; save(); renderTabs(); render(); }
    if (a === "flip" && sel) { var ed = f.edges[sel.i], t = ed.from; ed.from = ed.to; ed.to = t; save(); render(); }
    if (a === "reset") { delete store[cur]; sel = null; save(); renderTabs(); render(); }
    if (a === "export") { io = document.getElementById("io"); io.innerHTML = '<textarea readonly aria-label="Export du parcours">' + esc(JSON.stringify(getFlow(cur), null, 1)) + '</textarea><button class="btn btn--ink" data-act="copy">Copier</button>'; io.querySelector("textarea").select(); }
    if (a === "copy") { var ta = document.querySelector("#io textarea"); ta.select(); try { navigator.clipboard.writeText(ta.value); b.textContent = "Copié"; } catch (x) { document.execCommand("copy"); b.textContent = "Copié"; } }
    if (a === "import") { io = document.getElementById("io"); io.innerHTML = '<textarea aria-label="Coller un parcours exporté" placeholder="Coller ici le texte exporté"></textarea><button class="btn btn--ink" data-act="doimport">Charger</button>'; }
    if (a === "doimport") { try { var obj = JSON.parse(document.querySelector("#io textarea").value); if (obj.nodes && obj.edges) { obj.id = cur; store[cur] = obj; sel = null; save(); renderTabs(); render(); } } catch (x) { b.textContent = "Texte illisible"; } }
  });

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-flow]"); if (!b) return;
    cur = b.dataset.flow; sel = null; linkSrc = null; document.getElementById("wrap").scrollTo(0, 0); renderTabs(); render();
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input, textarea, select")) return;
    if ((e.key === "Delete" || e.key === "Backspace") && sel) { e.preventDefault(); removeSel(); }
    if (e.key === "Escape") { sel = null; linkSrc = null; linkMode = false; document.querySelector('[data-tool="link"]').setAttribute("aria-pressed", "false"); render(); }
    if (e.key === "Enter" && e.target.closest && e.target.closest("[data-node]")) { sel = { kind: "node", id: e.target.closest("[data-node]").dataset.node }; render(); }
  });
  window.addEventListener("resize", render);

  renderTabs(); render();
})();
</script>
</body>
</html>
